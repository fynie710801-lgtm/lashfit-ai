<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e9">
<title>LashFit AI｜美睫試戴</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  background:#f7f1e9;
  color:#4b352b;
}
.app{
  width:min(100%,760px);
  margin:auto;
  min-height:100vh;
  padding:22px 18px 40px;
}
header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:18px;
}
.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}
.logo span{color:#b99a63}
.sub{
  color:#9a7966;
  font-weight:600;
  margin-top:2px;
}
.badge{
  font-size:12px;
  background:#eadbc7;
  padding:7px 10px;
  border-radius:999px;
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#29231f;
  border-radius:32px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(72,49,37,.12);
}
#photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}
#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  pointer-events:none;
}
.empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
  padding:30px;
}
.face{
  width:180px;
  height:245px;
  border:3px solid rgba(255,255,255,.75);
  border-radius:50%;
  margin-bottom:30px;
}
.empty strong{
  font-size:26px;
  margin-bottom:10px;
}
.empty small{
  color:#d9d1cb;
  font-size:16px;
  line-height:1.6;
}

.actions{
  display:grid;
  grid-template-columns:1fr 86px;
  gap:12px;
  margin-top:14px;
}
.btn{
  border:0;
  min-height:62px;
  border-radius:22px;
  font-size:19px;
  font-weight:750;
  cursor:pointer;
}
.primary{
  background:#674b3b;
  color:white;
}
.secondary{
  background:white;
  color:#674b3b;
  border:1px solid #ddcdbd;
  font-size:28px;
}
input[type=file]{display:none}

.sectionTitle{
  margin:26px 4px 13px;
  font-size:18px;
  font-weight:800;
}

.styles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.styleBtn{
  min-height:70px;
  border:1px solid #dbc9b9;
  background:#fffdfa;
  border-radius:20px;
  color:#563d31;
  font-size:15px;
  padding:8px;
}
.styleBtn.active{
  background:#674b3b;
  color:white;
  border-color:#674b3b;
}

.compare{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.compare button{
  flex:1;
  border:1px solid #d9c7b6;
  border-radius:16px;
  padding:13px 8px;
  background:white;
  color:#604639;
  font-weight:700;
}
.compare button.active{
  background:#c5a46b;
  color:white;
  border-color:#c5a46b;
}

.panel{
  margin-top:20px;
  background:#fffaf4;
  border:1px solid #eadccd;
  border-radius:24px;
  padding:18px;
}
.eyeTabs{
  display:flex;
  gap:8px;
  margin-bottom:17px;
}
.eyeTab{
  flex:1;
  border:0;
  border-radius:14px;
  padding:12px;
  background:#eee2d6;
  color:#63493b;
  font-weight:700;
}
.eyeTab.active{
  background:#674b3b;
  color:white;
}

.control{
  margin:15px 0;
}
.control label{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:8px;
  font-weight:650;
}
input[type=range]{
  width:100%;
  accent-color:#9a765d;
}

.bottomActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}
.bottomActions button{
  border:0;
  border-radius:18px;
  min-height:54px;
  font-size:16px;
  font-weight:750;
}
.reset{
  background:#eadfd4;
  color:#604639;
}
.save{
  background:#b69762;
  color:white;
}

.note{
  margin-top:18px;
  padding:15px;
  background:#eee2d4;
  border-radius:18px;
  color:#795e4e;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:390px){
  .app{padding:16px 13px 30px}
  .logo{font-size:27px}
  .styleBtn{font-size:14px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">LashFit <span>AI</span></div>
    <div class="sub">美睫專業試戴系統</div>
  </div>
  <div class="badge">V2 試戴版</div>
</header>

<div class="stage" id="stage">

  <img id="photo">

  <canvas id="canvas"></canvas>

  <div class="empty" id="empty">
    <div class="face"></div>
    <strong>拍攝客人正面照</strong>
    <small>
      請保持正面、雙眼清楚<br>
      拍攝完成後即可進入睫毛試戴
    </small>
  </div>

</div>

<div class="actions">

  <button class="btn primary" onclick="cameraInput.click()">
    📷 拍照
  </button>

  <button class="btn secondary" onclick="albumInput.click()">
    ＋
  </button>

</div>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="user"
>

<input
  id="albumInput"
  type="file"
  accept="image/*"
>

<div class="sectionTitle">選擇睫毛款式</div>

<div class="styles">

<button class="styleBtn active" data-style="0">
6D自然濃密
</button>

<button class="styleBtn" data-style="1">
6DYY編織
</button>

<button class="styleBtn" data-style="2">
小紅書設計款
</button>

<button class="styleBtn" data-style="3">
6D自然
</button>

<button class="styleBtn" data-style="4">
6D裸妝
</button>

<button class="styleBtn" data-style="5">
6D焦糖（咖）
</button>

</div>

<div class="compare">

<button id="originalBtn">
原圖
</button>

<button id="tryBtn" class="active">
試戴後
</button>

</div>

<div class="panel">

<div class="eyeTabs">

<button class="eyeTab active" data-eye="left">
左眼
</button>

<button class="eyeTab" data-eye="right">
右眼
</button>

</div>

<div class="control">
<label>
<span>左右位置</span>
<span id="xValue">0</span>
</label>
<input id="xRange" type="range" min="-80" max="80" value="0">
</div>

<div class="control">
<label>
<span>上下位置</span>
<span id="yValue">0</span>
</label>
<input id="yRange" type="range" min="-80" max="80" value="0">
</div>

<div class="control">
<label>
<span>寬度</span>
<span id="scaleValue">100%</span>
</label>
<input id="scaleRange" type="range" min="60" max="150" value="100">
</div>

<div class="control">
<label>
<span>旋轉角度</span>
<span id="rotateValue">0°</span>
</label>
<input id="rotateRange" type="range" min="-25" max="25" value="0">
</div>

<div class="control">
<label>
<span>濃度</span>
<span id="opacityValue">85%</span>
</label>
<input id="opacityRange" type="range" min="30" max="100" value="85">
</div>

</div>

<div class="bottomActions">

<button class="reset" id="resetBtn">
重新定位
</button>

<button class="save" id="saveBtn">
儲存試戴照
</button>

</div>

<div class="note">
目前版本先建立完整試戴操作流程。下一階段會接入眼睛自動定位，並把固定的六款睫毛素材精準貼合到左右眼，不改變客人的臉型、五官與妝容。
</div>

</div>

<script>

const photo = document.getElementById("photo");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const empty = document.getElementById("empty");

let currentStyle = 0;
let currentEye = "left";
let showLashes = true;
let loaded = false;

const eyes = {

left:{
  x:0,
  y:0,
  scale:100,
  rotate:0,
  opacity:85
},

right:{
  x:0,
  y:0,
  scale:100,
  rotate:0,
  opacity:85
}

};

const styleSettings = [

{
count:22,
length:1.05,
spread:1,
color:"#17120f"
},

{
count:18,
length:1.12,
spread:1.25,
color:"#18120f"
},

{
count:16,
length:1.28,
spread:1.5,
color:"#18120f"
},

{
count:18,
length:.92,
spread:1,
color:"#1c1714"
},

{
count:15,
length:.82,
spread:.9,
color:"#241c18"
},

{
count:18,
length:1.03,
spread:1.1,
color:"#4a3024"
}

];

function loadImage(file){

if(!file)return;

const reader = new FileReader();

reader.onload = e => {

photo.onload = () => {

loaded = true;

photo.style.display = "block";
canvas.style.display = "block";
empty.style.display = "none";

resizeCanvas();

draw();

};

photo.src = e.target.result;

};

reader.readAsDataURL(file);

}

cameraInput.addEventListener("change",e=>{
loadImage(e.target.files[0]);
});

albumInput.addEventListener("change",e=>{
loadImage(e.target.files[0]);
});

function resizeCanvas(){

const rect = stage.getBoundingClientRect();

canvas.width = Math.round(rect.width * devicePixelRatio);
canvas.height = Math.round(rect.height * devicePixelRatio);

ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}

function draw(){

if(!loaded)return;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

if(!showLashes)return;

drawEye("left");
drawEye("right");

}

function drawEye(side){

const rect = stage.getBoundingClientRect();

const w = rect.width;
const h = rect.height;

const setting = eyes[side];
const style = styleSettings[currentStyle];

let centerX;

if(side==="left"){
centerX = w * .36;
}else{
centerX = w * .64;
}

let centerY = h * .37;

centerX += setting.x;
centerY += setting.y;

const baseWidth =
w *
.22 *
(setting.scale/100);

const direction =
side==="left"
? 1
: -1;

ctx.save();

ctx.translate(
centerX,
centerY
);

ctx.rotate(
setting.rotate *
Math.PI/180 *
direction
);

ctx.globalAlpha =
setting.opacity/100;

ctx.strokeStyle =
style.color;

ctx.lineCap="round";

const count=style.count;

for(let i=0;i<count;i++){

const t =
i/(count-1);

const x =
(t-.5) *
baseWidth;

const curve =
Math.sin(t*Math.PI);

const outerBoost =
side==="left"
? t
: 1-t;

const length =
(
12 +
18*curve +
15*outerBoost
) *
style.length *
(setting.scale/100);

const lean =
(
(t-.5) *
8 *
style.spread
);

ctx.beginPath();

ctx.moveTo(
x,
curve*3
);

ctx.quadraticCurveTo(
x+lean*.45,
-length*.55,
x+lean,
-length
);

ctx.lineWidth =
currentStyle===0
? 2.0
: 1.55;

ctx.stroke();

}

ctx.restore();

}

document.querySelectorAll(".styleBtn").forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".styleBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

currentStyle =
Number(btn.dataset.style);

showLashes=true;

originalBtn.classList.remove("active");
tryBtn.classList.add("active");

draw();

};

});

document.querySelectorAll(".eyeTab").forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".eyeTab")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

currentEye =
btn.dataset.eye;

syncControls();

};

});

function syncControls(){

const e =
eyes[currentEye];

xRange.value=e.x;
yRange.value=e.y;
scaleRange.value=e.scale;
rotateRange.value=e.rotate;
opacityRange.value=e.opacity;

updateLabels();

}

function updateLabels(){

xValue.textContent=xRange.value;
yValue.textContent=yRange.value;

scaleValue.textContent=
scaleRange.value+"%";

rotateValue.textContent=
rotateRange.value+"°";

opacityValue.textContent=
opacityRange.value+"%";

}

function bindRange(
element,
property
){

element.oninput=()=>{

eyes[currentEye][property] =
Number(element.value);

updateLabels();

draw();

};

}

bindRange(xRange,"x");
bindRange(yRange,"y");
bindRange(scaleRange,"scale");
bindRange(rotateRange,"rotate");
bindRange(opacityRange,"opacity");

originalBtn.onclick=()=>{

showLashes=false;

originalBtn.classList.add("active");
tryBtn.classList.remove("active");

draw();

};

tryBtn.onclick=()=>{

showLashes=true;

tryBtn.classList.add("active");
originalBtn.classList.remove("active");

draw();

};

resetBtn.onclick=()=>{

eyes.left={
x:0,
y:0,
scale:100,
rotate:0,
opacity:85
};

eyes.right={
x:0,
y:0,
scale:100,
rotate:0,
opacity:85
};

syncControls();

draw();

};

saveBtn.onclick=()=>{

if(!loaded){

alert("請先拍照或選擇照片");

return;

}

const output =
document.createElement("canvas");

output.width =
photo.naturalWidth;

output.height =
photo.naturalHeight;

const octx =
output.getContext("2d");

octx.drawImage(
photo,
0,
0,
output.width,
output.height
);

const stageRect =
stage.getBoundingClientRect();

const scaleX =
output.width /
stageRect.width;

const scaleY =
output.height /
stageRect.height;

if(showLashes){

octx.drawImage(
canvas,
0,
0,
canvas.width,
canvas.height,
0,
0,
output.width,
output.height
);

}

const link =
document.createElement("a");

link.download =
"LashFit-AI-試戴結果.png";

link.href =
output.toDataURL("image/png");

link.click();

};

window.addEventListener("resize",()=>{

if(loaded){

resizeCanvas();
draw();

}

});

syncControls();

</script>

</body>
</html>
