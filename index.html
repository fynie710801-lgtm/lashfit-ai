<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e9">

<title>LashFit AI｜睫毛試戴</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  background:#f7f1e9;
  color:#4b352b;
}

.app{
  max-width:760px;
  margin:auto;
  padding:20px 16px 40px;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.logo span{
  color:#b99a63;
}

.sub{
  margin-top:2px;
  color:#9a7966;
  font-weight:600;
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  margin-top:20px;
  background:#28231f;
  border-radius:30px;
  overflow:hidden;
}

#photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  z-index:1;
}

#lashLayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
  display:none;
  overflow:visible;
}

.empty{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
}

.face{
  width:180px;
  height:240px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  margin-bottom:25px;
}

.empty h2{
  margin:0 0 10px;
}

.empty p{
  margin:0;
  opacity:.75;
  line-height:1.7;
}

.actions{
  display:grid;
  grid-template-columns:1fr 80px;
  gap:10px;
  margin-top:14px;
}

button{
  font-family:inherit;
}

.photoBtn{
  border:0;
  border-radius:20px;
  padding:17px;
  background:#674b3b;
  color:white;
  font-size:18px;
  font-weight:750;
}

.albumBtn{
  border:1px solid #dbcaba;
  border-radius:20px;
  background:white;
  color:#674b3b;
  font-size:28px;
}

input[type=file]{
  display:none;
}

.title{
  margin:26px 3px 12px;
  font-size:18px;
  font-weight:800;
}

.styles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.styleBtn{
  min-height:68px;
  border:1px solid #ddcbbb;
  border-radius:18px;
  background:white;
  color:#5b4033;
  padding:8px;
}

.styleBtn.active{
  background:#674b3b;
  color:white;
}

.eyeTabs{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.eyeTab{
  flex:1;
  border:0;
  border-radius:14px;
  padding:12px;
  background:#eadfd4;
  color:#5b4033;
  font-weight:700;
}

.eyeTab.active{
  background:#b69762;
  color:white;
}

.panel{
  background:white;
  padding:16px;
  border-radius:22px;
  border:1px solid #eadfd4;
}

.control{
  margin:15px 0;
}

.control label{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:7px;
}

input[type=range]{
  width:100%;
  accent-color:#9b7658;
}

.compare{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.compare button{
  flex:1;
  border:1px solid #dccbbb;
  border-radius:14px;
  padding:12px;
  background:white;
  color:#5b4033;
  font-weight:700;
}

.compare button.active{
  background:#674b3b;
  color:white;
}

.notice{
  margin-top:16px;
  padding:13px;
  border-radius:16px;
  background:#eee2d6;
  color:#795e4e;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">
    LashFit <span>AI</span>
  </div>

  <div class="sub">
    美睫專業試戴系統
  </div>

  <div class="stage" id="stage">

    <img id="photo">

    <svg
      id="lashLayer"
      viewBox="0 0 1000 1333"
      preserveAspectRatio="none"
    >

      <g id="leftLash"></g>
      <g id="rightLash"></g>

    </svg>

    <div class="empty" id="empty">

      <div class="face"></div>

      <h2>拍攝客人正面照</h2>

      <p>
        請保持正面、雙眼清楚<br>
        拍照完成後進入睫毛試戴
      </p>

    </div>

  </div>

  <div class="actions">

    <button
      class="photoBtn"
      id="photoButton"
    >
      📷 拍照
    </button>

    <button
      class="albumBtn"
      id="albumButton"
    >
      ＋
    </button>

  </div>

  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="user"
  >

  <input
    id="albumInput"
    type="file"
    accept="image/*"
  >

  <div class="title">
    選擇睫毛款式
  </div>

  <div class="styles">

    <button class="styleBtn active" data-style="0">
      6D自然濃密
    </button>

    <button class="styleBtn" data-style="1">
      6DYY編織
    </button>

    <button class="styleBtn" data-style="2">
      小紅書設計款
    </button>

    <button class="styleBtn" data-style="3">
      6D自然
    </button>

    <button class="styleBtn" data-style="4">
      6D裸妝
    </button>

    <button class="styleBtn" data-style="5">
      6D焦糖（咖）
    </button>

  </div>

  <div class="compare">

    <button id="originalButton">
      原圖
    </button>

    <button id="tryButton" class="active">
      試戴後
    </button>

  </div>

  <div class="title">
    左右眼微調
  </div>

  <div class="panel">

    <div class="eyeTabs">

      <button class="eyeTab active" data-eye="left">
        左眼
      </button>

      <button class="eyeTab" data-eye="right">
        右眼
      </button>

    </div>

    <div class="control">

      <label>
        <span>左右位置</span>
        <span id="xValue">0</span>
      </label>

      <input
        id="xRange"
        type="range"
        min="-150"
        max="150"
        value="0"
      >

    </div>

    <div class="control">

      <label>
        <span>上下位置</span>
        <span id="yValue">0</span>
      </label>

      <input
        id="yRange"
        type="range"
        min="-150"
        max="150"
        value="0"
      >

    </div>

    <div class="control">

      <label>
        <span>大小</span>
        <span id="scaleValue">100%</span>
      </label>

      <input
        id="scaleRange"
        type="range"
        min="50"
        max="180"
        value="100"
      >

    </div>

    <div class="control">

      <label>
        <span>旋轉</span>
        <span id="rotateValue">0°</span>
      </label>

      <input
        id="rotateRange"
        type="range"
        min="-30"
        max="30"
        value="0"
      >

    </div>

  </div>

  <div class="notice">
    目前使用明顯的測試睫毛確認「睫毛圖層、左右眼位置、大小、旋轉」功能正常。確認成功後，再換成你鎖定的六款真正睫毛素材。
  </div>

</div>

<script>

const photo =
document.getElementById("photo");

const lashLayer =
document.getElementById("lashLayer");

const leftLash =
document.getElementById("leftLash");

const rightLash =
document.getElementById("rightLash");

const empty =
document.getElementById("empty");

const cameraInput =
document.getElementById("cameraInput");

const albumInput =
document.getElementById("albumInput");

const photoButton =
document.getElementById("photoButton");

const albumButton =
document.getElementById("albumButton");

const originalButton =
document.getElementById("originalButton");

const tryButton =
document.getElementById("tryButton");

const xRange =
document.getElementById("xRange");

const yRange =
document.getElementById("yRange");

const scaleRange =
document.getElementById("scaleRange");

const rotateRange =
document.getElementById("rotateRange");

const xValue =
document.getElementById("xValue");

const yValue =
document.getElementById("yValue");

const scaleValue =
document.getElementById("scaleValue");

const rotateValue =
document.getElementById("rotateValue");


let currentEye = "left";
let currentStyle = 0;


const eyes = {

  left:{
    x:0,
    y:0,
    scale:100,
    rotate:0
  },

  right:{
    x:0,
    y:0,
    scale:100,
    rotate:0
  }

};


photoButton.onclick = () => {
  cameraInput.click();
};

albumButton.onclick = () => {
  albumInput.click();
};


cameraInput.onchange = e => {
  loadPhoto(e.target.files[0]);
};

albumInput.onchange = e => {
  loadPhoto(e.target.files[0]);
};


function loadPhoto(file){

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload = e => {

    photo.onload = () => {

      photo.style.display =
      "block";

      lashLayer.style.display =
      "block";

      empty.style.display =
      "none";

      drawLashes();

    };

    photo.src =
    e.target.result;

  };

  reader.readAsDataURL(file);

}


function lashPath(
  side,
  count,
  length,
  spacing
){

  let output = "";

  for(
    let i=0;
    i<count;
    i++
  ){

    const t =
    i/(count-1);

    const x =
    (t-.5) *
    210 *
    spacing;

    const curve =
    Math.sin(t*Math.PI);

    let extra;

    if(side==="left"){
      extra = t*30;
    }else{
      extra = (1-t)*30;
    }

    const len =
    (
      42 +
      curve*45 +
      extra
    ) *
    length;

    const lean =
    (t-.5)*30;

    output +=
    `
    <path
      d="
        M ${x} ${curve*12}
        Q ${x+lean*.4} ${-len*.55}
          ${x+lean} ${-len}
      "
      fill="none"
      stroke="currentColor"
      stroke-width="7"
      stroke-linecap="round"
    />
    `;

  }

  return output;

}


function drawLashes(){

  let count = 18;
  let length = 1;
  let spacing = 1;
  let color = "#16100d";

  if(currentStyle===0){
    count=24;
    length=1.05;
    spacing=1;
  }

  if(currentStyle===1){
    count=20;
    length=1.15;
    spacing=1.05;
  }

  if(currentStyle===2){
    count=17;
    length=1.35;
    spacing=1.08;
  }

  if(currentStyle===3){
    count=18;
    length=.92;
  }

  if(currentStyle===4){
    count=15;
    length=.82;
  }

  if(currentStyle===5){
    count=19;
    length=1.05;
    color="#503327";
  }


  leftLash.innerHTML =
  lashPath(
    "left",
    count,
    length,
    spacing
  );


  rightLash.innerHTML =
  lashPath(
    "right",
    count,
    length,
    spacing
  );


  leftLash.style.color =
  color;

  rightLash.style.color =
  color;


  updateEyeTransform("left");
  updateEyeTransform("right");

}


function updateEyeTransform(side){

  const data =
  eyes[side];

  let cx;

  if(side==="left"){
    cx = 355;
  }else{
    cx = 645;
  }

  const cy = 480;

  const sx =
  data.scale/100;

  const mirror =
  side==="right"
  ? -1
  : 1;


  const transform =
  `
  translate(
    ${cx + data.x}
    ${cy + data.y}
  )
  rotate(
    ${data.rotate}
  )
  scale(
    ${sx * mirror}
    ${sx}
  )
  `;


  if(side==="left"){

    leftLash.setAttribute(
      "transform",
      transform
    );

  }else{

    rightLash.setAttribute(
      "transform",
      transform
    );

  }

}


document
.querySelectorAll(".styleBtn")
.forEach(button => {

  button.onclick = () => {

    document
    .querySelectorAll(".styleBtn")
    .forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");

    currentStyle =
    Number(
      button.dataset.style
    );

    lashLayer.style.display =
    "block";

    originalButton
    .classList
    .remove("active");

    tryButton
    .classList
    .add("active");

    drawLashes();

  };

});


document
.querySelectorAll(".eyeTab")
.forEach(button => {

  button.onclick = () => {

    document
    .querySelectorAll(".eyeTab")
    .forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");

    currentEye =
    button.dataset.eye;

    syncControls();

  };

});


function syncControls(){

  const data =
  eyes[currentEye];

  xRange.value =
  data.x;

  yRange.value =
  data.y;

  scaleRange.value =
  data.scale;

  rotateRange.value =
  data.rotate;

  updateLabels();

}


function updateLabels(){

  xValue.textContent =
  xRange.value;

  yValue.textContent =
  yRange.value;

  scaleValue.textContent =
  scaleRange.value + "%";

  rotateValue.textContent =
  rotateRange.value + "°";

}


xRange.oninput = () => {

  eyes[currentEye].x =
  Number(xRange.value);

  updateLabels();

  updateEyeTransform(
    currentEye
  );

};


yRange.oninput = () => {

  eyes[currentEye].y =
  Number(yRange.value);

  updateLabels();

  updateEyeTransform(
    currentEye
  );

};


scaleRange.oninput = () => {

  eyes[currentEye].scale =
  Number(scaleRange.value);

  updateLabels();

  updateEyeTransform(
    currentEye
  );

};


rotateRange.oninput = () => {

  eyes[currentEye].rotate =
  Number(rotateRange.value);

  updateLabels();

  updateEyeTransform(
    currentEye
  );

};


originalButton.onclick = () => {

  lashLayer.style.display =
  "none";

  originalButton
  .classList
  .add("active");

  tryButton
  .classList
  .remove("active");

};


tryButton.onclick = () => {

  if(!photo.src) return;

  lashLayer.style.display =
  "block";

  tryButton
  .classList
  .add("active");

  originalButton
  .classList
  .remove("active");

};


syncControls();
drawLashes();

</script>

</body>
</html>
