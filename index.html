<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f1e9">
<title>LashFit AI｜睫毛試戴</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f1e9;
  color:#4b352b;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 40px;
}
.logo{
  font-size:28px;
  font-weight:800;
  margin:6px 4px 3px;
}
.logo span{color:#b7925c}
.sub{
  margin:0 4px 18px;
  color:#9c7d68;
  font-size:14px;
  font-weight:600;
}
.stage{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  border-radius:26px;
  overflow:hidden;
  background:#28231f;
  box-shadow:0 12px 30px rgba(60,40,30,.12);
}
#canvas{
  display:none;
  width:100%;
  height:100%;
}
.empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  text-align:center;
  padding:30px;
}
.face{
  width:180px;
  height:240px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  margin-bottom:25px;
}
.empty h2{margin:0 0 10px}
.empty p{
  margin:0;
  opacity:.72;
  line-height:1.7;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.btn{
  border:0;
  border-radius:18px;
  padding:16px;
  font-weight:700;
  font-size:16px;
}
.photo-btn{
  flex:1;
  background:#62493b;
  color:#fff;
}
.plus-btn{
  width:62px;
  background:#fff;
  border:1px solid #d9c9ba;
  color:#62493b;
  font-size:24px;
}
input[type=file]{display:none}
.hidden{display:none}

.title{
  margin:25px 2px 12px;
  font-weight:800;
  font-size:16px;
}
.styles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.style{
  min-height:65px;
  padding:8px;
  background:#fff;
  border:1px solid #dfd0c2;
  color:#5d4337;
  border-radius:18px;
}
.style.active{
  background:#62493b;
  color:#fff;
  border-color:#62493b;
}
.status{
  margin-top:12px;
  background:#efe3d7;
  border-radius:15px;
  padding:12px;
  font-size:12px;
  line-height:1.6;
  color:#826756;
}

.panel{
  background:#fff;
  padding:15px;
  border-radius:20px;
  border:1px solid #e5d9cf;
}
.tabs{
  display:flex;
  gap:8px;
}
.tab{
  flex:1;
  border:0;
  padding:11px;
  border-radius:13px;
  background:#eee5dc;
  color:#674d3e;
}
.tab.active{
  background:#b7925c;
  color:white;
}
.control{margin-top:16px}
.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:7px;
}
input[type=range]{
  width:100%;
  accent-color:#9a744c;
}

.bottom{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.reset,.save{
  flex:1;
  border:0;
  border-radius:16px;
  padding:15px;
  font-weight:800;
}
.reset{
  background:#e9ded4;
  color:#62493b;
}
.save{
  background:#b7925c;
  color:#fff;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">LashFit <span>AI</span></div>
  <div class="sub">美睫專業試戴系統</div>

  <div class="stage">
    <canvas id="canvas"></canvas>

    <div id="empty" class="empty">
      <div class="face"></div>
      <h2>拍攝客人正面照</h2>
      <p>請保持正面、雙眼清楚<br>拍攝完成後進入睫毛試戴</p>
    </div>
  </div>

  <div class="actions">
    <button class="btn photo-btn" onclick="camera.click()">📷 拍照</button>
    <button class="btn plus-btn" onclick="library.click()">＋</button>
  </div>

  <input id="camera" type="file" accept="image/*" capture="user">
  <input id="library" type="file" accept="image/*">

  <div id="tryon" class="hidden">

    <div class="title">選擇睫毛款式</div>

    <div class="styles">
      <button class="style active" onclick="selectStyle(0,this)">6D自然濃密</button>
      <button class="style" onclick="selectStyle(1,this)">6DYY編織</button>
      <button class="style" onclick="selectStyle(2,this)">小紅書設計款</button>
      <button class="style" onclick="selectStyle(3,this)">6D自然</button>
      <button class="style" onclick="selectStyle(4,this)">6D裸妝</button>
      <button class="style" onclick="selectStyle(5,this)">6D焦糖（咖）</button>
    </div>

    <div id="status" class="status">
      睫毛貼合引擎已啟用。下一步加入你的固定六款透明睫毛素材。
    </div>

    <div class="title">左右眼微調</div>

    <div class="panel">

      <div class="tabs">
        <button id="leftTab" class="tab active" onclick="chooseEye('left')">左眼</button>
        <button id="rightTab" class="tab" onclick="chooseEye('right')">右眼</button>
      </div>

      <div class="control">
        <div class="row"><span>左右位置</span><span id="xText">0</span></div>
        <input id="x" type="range" min="-120" max="120" value="0">
      </div>

      <div class="control">
        <div class="row"><span>上下位置</span><span id="yText">0</span></div>
        <input id="y" type="range" min="-100" max="100" value="0">
      </div>

      <div class="control">
        <div class="row"><span>大小</span><span id="scaleText">100%</span></div>
        <input id="scale" type="range" min="50" max="180" value="100">
      </div>

      <div class="control">
        <div class="row"><span>旋轉</span><span id="rotateText">0°</span></div>
        <input id="rotate" type="range" min="-30" max="30" value="0">
      </div>

    </div>

    <div class="bottom">
      <button class="reset" onclick="resetApp()">重新拍照</button>
      <button class="save" onclick="saveImage()">儲存結果</button>
    </div>

  </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const empty=document.getElementById("empty");
const tryon=document.getElementById("tryon");

const camera=document.getElementById("camera");
const library=document.getElementById("library");

const baseImage=new Image();

let currentEye="left";
let currentStyle=0;

const lashFiles=[
  "lashes/6d-natural-dense.png",
  "lashes/6d-yy.png",
  "lashes/xiaohongshu.png",
  "lashes/6d-natural.png",
  "lashes/6d-nude.png",
  "lashes/6d-caramel.png"
];

const lashNames=[
  "6D自然濃密",
  "6DYY編織",
  "小紅書設計款",
  "6D自然",
  "6D裸妝",
  "6D焦糖（咖）"
];

let lashLeft=new Image();
let lashRight=new Image();
let lashLoaded=false;

const eye={
  left:{x:0,y:0,scale:100,rotate:0},
  right:{x:0,y:0,scale:100,rotate:0}
};

camera.addEventListener("change",loadPhoto);
library.addEventListener("change",loadPhoto);

function loadPhoto(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(ev){
    baseImage.onload=function(){

      canvas.width=baseImage.naturalWidth;
      canvas.height=baseImage.naturalHeight;

      canvas.style.display="block";
      empty.style.display="none";
      tryon.classList.remove("hidden");

      resetEyePositions();
      loadLash();
      draw();

      setTimeout(()=>{
        tryon.scrollIntoView({behavior:"smooth"});
      },250);
    };

    baseImage.src=ev.target.result;
  };

  reader.readAsDataURL(file);
}

function resetEyePositions(){

  eye.left={
    x:-canvas.width*.175,
    y:-canvas.height*.105,
    scale:100,
    rotate:0
  };

  eye.right={
    x:canvas.width*.175,
    y:-canvas.height*.105,
    scale:100,
    rotate:0
  };

  loadControls();
}

function loadLash(){

  lashLoaded=false;

  const src=lashFiles[currentStyle];

  lashLeft=new Image();
  lashRight=new Image();

  let loaded=0;

  function done(){
    loaded++;
    if(loaded===2){
      lashLoaded=true;
      document.getElementById("status").textContent=
      "目前款式："+lashNames[currentStyle]+"｜素材已載入，可微調左右眼。";
      draw();
    }
  }

  function failed(){
    document.getElementById("status").textContent=
    "目前款式："+lashNames[currentStyle]+"｜等待加入你的原始睫毛透明素材。";
    draw();
  }

  lashLeft.onload=done;
  lashRight.onload=done;

  lashLeft.onerror=failed;
  lashRight.onerror=failed;

  lashLeft.src=src;
  lashRight.src=src;
}

function draw(){

  if(!baseImage.src)return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(
    baseImage,
    0,0,
    canvas.width,
    canvas.height
  );

  if(!lashLoaded)return;

  drawEye("left",lashLeft,false);
  drawEye("right",lashRight,true);
}

function drawEye(side,img,mirror){

  const d=eye[side];

  const baseWidth=canvas.width*.26;
  const ratio=img.naturalHeight/img.naturalWidth;

  const w=baseWidth*(d.scale/100);
  const h=w*ratio;

  const centerX=canvas.width/2+d.x;
  const centerY=canvas.height/2+d.y;

  ctx.save();

  ctx.translate(centerX,centerY);
  ctx.rotate(d.rotate*Math.PI/180);

  if(mirror){
    ctx.scale(-1,1);
  }

  ctx.drawImage(
    img,
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.restore();
}

function selectStyle(index,btn){

  currentStyle=index;

  document.querySelectorAll(".style")
  .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  loadLash();
}

function chooseEye(side){

  currentEye=side;

  leftTab.classList.toggle("active",side==="left");
  rightTab.classList.toggle("active",side==="right");

  loadControls();
}

function loadControls(){

  const d=eye[currentEye];

  x.value=Math.round(d.x);
  y.value=Math.round(d.y);
  scale.value=d.scale;
  rotate.value=d.rotate;

  labels();
}

function labels(){

  const d=eye[currentEye];

  xText.textContent=Math.round(d.x);
  yText.textContent=Math.round(d.y);
  scaleText.textContent=d.scale+"%";
  rotateText.textContent=d.rotate+"°";
}

x.addEventListener("input",function(){
  eye[currentEye].x=Number(this.value);
  labels();
  draw();
});

y.addEventListener("input",function(){
  eye[currentEye].y=Number(this.value);
  labels();
  draw();
});

scale.addEventListener("input",function(){
  eye[currentEye].scale=Number(this.value);
  labels();
  draw();
});

rotate.addEventListener("input",function(){
  eye[currentEye].rotate=Number(this.value);
  labels();
  draw();
});

function resetApp(){

  baseImage.src="";
  canvas.style.display="none";
  empty.style.display="flex";
  tryon.classList.add("hidden");

  camera.value="";
  library.value="";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function saveImage(){

  if(!baseImage.src)return;

  if(!lashLoaded){
    alert("睫毛素材還沒加入。下一步加入你的六款固定睫毛後即可儲存試戴照片。");
    return;
  }

  const link=document.createElement("a");

  link.download="LashFit-AI-試戴結果.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
